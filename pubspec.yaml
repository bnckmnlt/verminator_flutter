name: flutter_vermicomposting
description: "A new Flutter project for Practice Design II Capstone"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  internet_connection_checker_plus: ^2.6.0
  flex_color_scheme: ^8.2.0
  fpdart: ^1.1.1
  flutter_bloc: ^9.1.1
  intl: ^0.20.1
  fluentui_system_icons: ^1.1.273
  liquid_progress_indicator_v2: ^0.5.0
  lottie: ^3.3.1
  dotted_border: ^3.0.1
  flutter_dotenv: ^6.0.0
  get_it: ^8.0.3
  toastification: ^3.0.2
  supabase_flutter: ^2.8.4
  mqtt_client: ^10.5.1
  google_fonts: ^6.2.1
  syncfusion_flutter_charts: ^31.1.19
  syncfusion_flutter_gauges: ^31.1.19
  data_table_2: ^2.6.0
  webview_flutter: ^4.13.0
  logging: ^1.3.0
  toggle_switch: ^2.3.0
  date_picker_plus: ^4.2.0
  onboarding: ^4.0.2
  flutter_tts: ^4.2.3
  galleryimage: ^2.0.1
  hydrated_bloc: ^10.0.0
  path_provider: ^2.1.5
  timeago: ^3.7.1
  wakelock_plus: ^1.4.0
  flutter_launcher_icons: ^0.14.4
  animated_text_kit: ^4.2.3
  step_progress_indicator: ^1.0.2
  skeletonizer: ^2.1.0+1
  markdown_widget: ^2.3.2+8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/animations/
    - assets/fonts/geist/
    - assets/fonts/general-sans/
    - assets/fonts/zenbones-mono/
    - assets/icons/
    - assets/images/
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Thin.ttf
          weight: 100
        - asset: assets/fonts/geist/Geist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/geist/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/geist/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/geist/Geist-Black.ttf
          weight: 900
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/geist/GeistMono-Thin.ttf
          weight: 100
        - asset: assets/fonts/geist/GeistMono-UltraLight.ttf
          weight: 200
        - asset: assets/fonts/geist/GeistMono-Light.ttf
          weight: 300
        - asset: assets/fonts/geist/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/GeistMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/geist/GeistMono-Black.ttf
          weight: 800
        - asset: assets/fonts/geist/GeistMono-UltraBlack.ttf
          weight: 900
    - family: Zenbones Mono
      fonts:
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-Light.ttf
          weight: 300
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-Regular.ttf
          weight: 400
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-Italic.ttf
          style: italic
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-Medium.ttf
          weight: 500
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-Bold.ttf
          weight: 700
        - asset: assets/fonts/zenbones-mono/Zenbones-Mono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Zenbones Brainy
      fonts:
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-Light.ttf
          weight: 300
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-Regular.ttf
          weight: 400
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-Italic.ttf
          style: italic
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-Medium.ttf
          weight: 500
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-Bold.ttf
          weight: 700
        - asset: assets/fonts/zenbones-brainy/Zenbones-Brainy-BoldItalic.ttf
          weight: 700
          style: italic

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
